name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # MinVer legge tag e storia: il clone shallow di default lo romperebbe.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build PhotoAtomic.Libraries.slnx --configuration Release

      - name: Test
        run: dotnet test PhotoAtomic.Libraries.slnx --configuration Release --no-build

  publish:
    # Pubblica su nuget.org solo sui tag v* (versioning lockstep: un tag, tutti i pacchetti).
    # Autenticazione via trusted publishing (OIDC): nessuna API key salvata, NuGet/login
    # scambia il token OIDC di GitHub con una API key temporanea.
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Pack
        run: dotnet pack PhotoAtomic.Libraries.slnx --configuration Release --output artifacts

      - name: NuGet login (trusted publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: PhotoAtomic

      - name: Push to nuget.org
        run: dotnet nuget push "artifacts/*.nupkg" --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
